[package]
name = "vasak-assistant-daemon"
description = "Asistente de IA residente de VasakOS: conversación con un modelo local"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "vasak-assistant"
path = "src/main.rs"

[dependencies]
vasak-assistant-protocol.workspace = true
serde.workspace = true
serde_json = "1"
zbus.workspace = true
tokio.workspace = true
# rustls y no OpenSSL, como el resto del workspace: un proveedor remoto va por
# https, y así no hace falta ninguna biblioteca de TLS del sistema.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
# Los directorios base XDG, como en vasak-health-service: la regla de que una
# ruta relativa o vacía se ignora vive ahí y no en una copia acá.
dirs = "6"
parking_lot = "0.12"
# `StreamExt::next` para la señal `NameOwnerChanged`. Ya estaba en el grafo
# (por hyper-util); no suma ningún crate.
futures-util = { version = "0.3", default-features = false }
tracing = "0.1"
# La memoria (fase 4): Grafeo embebido, sólo con lo que se usa —grafo de
# propiedades, GQL, WAL, un solo archivo y cifrado AES-256-GCM—, sin `mmap`,
# `spill`, `parallel`, `ai` ni `arrow`. Rust puro: no suma ningún `-sys` ni
# `cc`. Fijado con `=`: es una beta, la única que cifra (en 0.5.44 el rasgo
# `encryption` de `grafeo-engine` existe pero la base se escribe en claro).
grafeo = { version = "=0.6.0-beta.1", default-features = false, features = ["lpg", "gql", "wal", "grafeo-file", "encryption"] }
# La llave de la memoria: 32 bytes del sistema y borrados al soltarlos. Los dos
# ya los trae Grafeo.
getrandom = "0.4"
zeroize = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Para las pruebas del servicio: una conexión D-Bus punto a punto, sin bus.
zbus = { workspace = true, features = ["p2p"] }
