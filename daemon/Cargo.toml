[package]
name = "vasak-assistant-daemon"
description = "Asistente de IA residente de VasakOS: conversación con un modelo local"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "vasak-assistant"
path = "src/main.rs"

[dependencies]
vasak-assistant-protocol.workspace = true
serde.workspace = true
serde_json = "1"
zbus.workspace = true
tokio.workspace = true
# Sólo HTTP contra Ollama en la máquina: sin TLS, así no entra ni OpenSSL ni
# rustls. Un backend remoto (fase 2) decide su propio transporte.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
